# bkk-stock@.service (수집 작업) 에 덧붙이는 보호 설정 (deploy/harden.sh 가 /etc/systemd/system/bkk-stock@.service.d/ 에 설치)
# 보드가 뚫려도: sudo 못 씀, 코드·배포 스크립트·.git 못 고침, 같은 서버 갭 봇 폴더·SSH 키를 못 봄.
[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=full
ProtectHome=read-only
ReadWritePaths=__DIR__
ReadOnlyPaths=__DIR__/.git __DIR__/deploy __DIR__/.venv __DIR__/bkkstock __DIR__/gibalhae/pipeline
InaccessiblePaths=-__GAPDIR__ -__HOME__/.ssh
# 메모리가 모자라면 코인 봇보다 이 보드가 먼저 정리되게
OOMScoreAdjust=500
