<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<meta name="theme-color" content="#2f5bea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="건우주식">

<meta name="csrf" content="{{ csrf }}">
<title>{% block title %}보드{% endblock %} · 건우주식</title>
{% block head_before %}{% endblock %}
<link rel="stylesheet" href="/static/app.css?v={{ version }}">
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <a class="brand" href="/">건우<b>주식</b></a>
  <nav>
    <a href="/" class="{{ 'on' if nav == 'dashboard' }}">대시보드</a>
    <a href="/stocks" class="{{ 'on' if nav in ('stocks', 'stock') }}">📈 주식</a>
    {% if has_gibalhae %}<a href="/media" class="{{ 'on' if nav == 'gibalhae' }}" title="영상" aria-label="영상">🎬</a>{% endif %}
    <a href="/apis" class="{{ 'on' if nav == 'apis' }}">API 관리</a>
    <a href="/ops" class="{{ 'on' if nav == 'ops' }}">운영</a>
  </nav>
  <form method="post" action="/logout" class="logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="ghost">로그아웃</button></form>
</header>
{% if demo %}<div class="demo">샘플 데이터 화면입니다. 실제 시세나 공시가 아닙니다.</div>{% endif %}
<main>{% block content %}{% endblock %}</main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/static/app.js?v={{ version }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
