<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/static/manifest.json">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<meta name="theme-color" content="#2f5bea">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="건우주식">

<title>로그인 · 건우주식</title><link rel="stylesheet" href="/static/app.css?v={{ version }}"></head>
<body class="login-page">
<form class="login card" method="post">
  <div class="brand big">건우<b>주식</b></div>
  <p class="muted small" style="text-align:center;margin:-6px 0 6px">📈 주식 · 🎬 영상</p>
  {% if demo %}<p class="demo inline">샘플 데이터 화면</p>{% endif %}
  {% if not has_pw %}
    <p class="warnbox">아직 대시보드 비밀번호가 없습니다. 서버에서 <code>deploy/install.sh</code>를 실행하면 만들어집니다.</p>
  {% else %}
    <label for="pw">비밀번호</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <button type="submit">들어가기</button>
  {% endif %}
</form>
</body></html>
